name: iOS Unsigned IPA Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -v 1.16.2
          pod --version

      - name: Install dependencies
        timeout-minutes: 15
        run: |
          pod install

      - name: Archive iOS app
        run: |
          xcodebuild \
            -workspace Legado.xcworkspace \
            -scheme Legado \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Legado.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/Legado.xcarchive/Products/Applications/Legado.app" Payload/
          /usr/bin/zip -r Legado-Unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: Legado-Unsigned-IPA
          path: Legado-Unsigned.ipa
          retention-days: 7